name: Homebrew Tap CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-formula:
    runs-on: macos-latest
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@master

      - name: Trust tap
        run: brew trust --tap tokalang/tap || true

      - name: Install formula
        run: brew install tokalang/tap/trg

      - name: Test formula
        run: brew test tokalang/tap/trg

      - name: Verify CLI execution
        run: trg --version
