name: Homebrew Tap CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-formula:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@master

      - name: Trust and tap repository
        run: |
          brew trust --tap tokalang/tap || true
          brew tap tokalang/tap "$GITHUB_WORKSPACE"

      - name: Install formula
        run: |
          brew install tokalang/tap/trg

      - name: Test formula
        run: |
          brew test tokalang/tap/trg

      - name: Verify CLI execution
        run: |
          trg --version
